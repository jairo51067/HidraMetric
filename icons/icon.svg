<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Fondo Gradiente App -->
    <radialGradient id="bg-grad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Gradientes de Agua -->
    <linearGradient id="wave-front-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <linearGradient id="wave-back-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Reflejos de Cristal -->
    <linearGradient id="glass-specular" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="15%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="85%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Máscara exacta del interior del vaso -->
    <clipPath id="glass-inner-clip">
      <path d="M 152 145 C 152 145, 172 418, 177 428 C 183 438, 205 448, 256 448 C 307 448, 329 438, 335 428 C 340 418, 360 145, 360 145 Z"/>
    </clipPath>

    <!-- Filtro de Resplandor Suave -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base / Fondo de la App -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>

  <!-- AGUA Y CONTENIDO (Recortados dentro del vaso) -->
  <g clip-path="url(#glass-inner-clip)">
    <!-- Ola Trasera -->
    <path d="M 120 186 C 175 156, 230 216, 285 186 C 340 156, 395 216, 450 186 L 450 480 L 120 480 Z" fill="url(#wave-back-grad)"/>

    <!-- Ola Principal Frontal -->
    <path d="M 120 186 C 175 216, 230 156, 285 186 C 340 216, 395 156, 450 186 L 450 480 L 120 480 Z" fill="url(#wave-front-grad)"/>

    <!-- Brillo en la cresta de la ola -->
    <path d="M 120 186 C 175 216, 230 156, 285 186 C 340 216, 395 156, 450 186" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.6"/>

    <!-- BURBUJAS DETALLADAS -->
    <g fill="#ffffff">
      <circle cx="210" cy="380" r="4.5" opacity="0.45"/><circle cx="280" cy="340" r="6" opacity="0.5"/><circle cx="240" cy="290" r="3.5" opacity="0.6"/><circle cx="310" cy="390" r="5" opacity="0.35"/><circle cx="190" cy="320" r="4" opacity="0.4"/><circle cx="295" cy="275" r="3" opacity="0.7"/><circle cx="225" cy="410" r="5.5" opacity="0.3"/><circle cx="260" cy="360" r="2.5" opacity="0.55"/><circle cx="325" cy="320" r="4" opacity="0.45"/><circle cx="180" cy="360" r="3" opacity="0.5"/><circle cx="205" cy="300" r="5" opacity="0.4"/><circle cx="270" cy="400" r="4" opacity="0.35"/>
    </g>
  </g>

  <!-- ESTRUCTURA DEL VASO DE VIDRIO CRISTALINO -->
  
  <!-- Cuerpo base y sombra de vidrio -->
  <path d="M 150 135 C 150 135, 172 418, 177 428 C 183 440, 205 450, 256 450 C 307 450, 329 440, 335 428 C 340 418, 362 135, 362 135 Z" fill="url(#glass-specular)" stroke="none"/>

  <!-- Contorno de paredes del vaso -->
  <path d="M 150 135 L 177 428 C 183 440, 205 450, 256 450 C 307 450, 329 440, 335 428 L 362 135" fill="none" stroke="#ffffff" stroke-width="3.5" opacity="0.75" stroke-linejoin="round"/>

  <!-- Reflejo curvo de brillo lateral izquierdo -->
  <path d="M 162 155 L 183 415 C 185 423, 195 430, 215 434" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.35" stroke-linecap="round"/>

  <!-- Reflejo curvo de brillo lateral derecho -->
  <path d="M 350 155 L 331 415" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.25" stroke-linecap="round"/>

  <!-- BOCA DEL VASO (Apertura elíptica limpia 3D sin línea transversal central) -->
  <ellipse cx="256" cy="135" rx="106" ry="18" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.9"/>
  <!-- Brillo superior en el labio del vaso -->
  <ellipse cx="256" cy="135" rx="104" ry="16" fill="none" stroke="#7dd3fc" stroke-width="1.5" opacity="0.6"/>
</svg>